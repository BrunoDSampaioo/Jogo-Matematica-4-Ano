<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática Divertida 🚀</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #2d3436;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: popIn 0.4s ease-in-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 { color: #6c5ce7; font-size: 24px; margin-bottom: 10px; }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .lives { color: #d63031; }
        .help-btn {
            background: #fdcb6e;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #2d3436;
            transition: 0.2s;
        }
        .help-btn:hover:not(:disabled) { background: #e1b12c; transform: scale(1.05); }
        .help-btn:disabled { background: #dfe6e9; color: #b2bec3; cursor: not-allowed; }

        .exit-btn {
            background: #ff7675;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
        }
        .exit-btn:hover { background: #d63031; transform: scale(1.05); }

        .progress-bar {
            background: #dfe6e9;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            background: #00b894;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        #question { font-size: 18px; margin-bottom: 15px; font-weight: bold; color: #2d3436; }
        #explanation { font-size: 14px; margin-bottom: 15px; color: #0984e3; font-style: italic; background: #e8f4fd; padding: 10px; border-radius: 8px; border-left: 4px solid #0984e3; text-align: left; }
        .btn-container { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            background: #f1f2f6;
            border: 3px solid #dfe6e9;
            color: #2d3436;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .btn:hover:not(.disabled-option) { background: #74b9ff; color: #fff; border-color: #0984e3; transform: translateY(-2px); }
        .btn.correto { background: #00b894 !important; color: #fff !important; border-color: #00a884 !important; }
        .btn.errado { background: #ff7675 !important; color: #fff !important; border-color: #d63031 !important; }
        .disabled-option { opacity: 0.3; pointer-events: none; }

        .chapter-btn {
            background: #a29bfe;
            color: white;
            border: none;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .chapter-btn:hover { background: #6c5ce7; transform: translateY(-2px); }

        .input-text {
            width: 80%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .ranking-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #dfe6e9;
        }

        .hide { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Matemática Divertida ✨</h1>

        <!-- TELA DE LOGIN / NOME -->
        <div id="login-screen">
            <p style="font-weight: bold; color: #636e72;">Qual é o seu nome, campeã(o)?</p>
            <input type="text" id="player-name" class="input-text" placeholder="Digite seu nome..." autofocus>
            <br>
            <button class="chapter-btn" onclick="salvarNome()">Entrar no Jogo 🚀</button>
        </div>

        <!-- TELA DE SELEÇÃO DE CAPÍTULO E RANKING -->
        <div id="chapter-screen" class="hide">
            <p id="welcome-user" style="font-weight: bold; color: #6c5ce7; font-size: 16px;"></p>
            <p style="font-weight: bold; color: #636e72; margin-top: 10px;">Escolha o capítulo para estudar:</p>
            <div id="chapter-list"></div>
            
            <div style="margin-top: 20px; font-weight: bold; color: #2d3436;">🏆 Ranking de Acertos</div>
            <div class="ranking-box" id="ranking-list">
                <span style="color: #b2bec3;">Nenhum recorde ainda.</span>
            </div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hide">
            <div class="hud">
                <span class="lives" id="lives-text">Vidas: 💖💖💖</span>
                <button class="help-btn" id="help-btn" onclick="usarAjuda()">💡 Ajudas (3)</button>
                <button class="exit-btn" onclick="sairDoJogo()">🚪 Sair</button>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            
            <div id="question">Carregando pergunta...</div>
            <div id="explanation" class="hide"></div>
            <div class="btn-container" id="options"></div>
        </div>

        <!-- TELA DE RESULTADO -->
        <div id="score-screen" class="hide">
            <h2 id="score-title" style="color: #6c5ce7;">Fim de Jogo!</h2>
            <p id="score-text" style="font-size: 18px; font-weight: bold;"></p>
            <button class="chapter-btn" onclick="voltarMenu()" style="margin-top: 15px;">Escolher Outro Capítulo 📚</button>
        </div>
    </div>

    <!-- Importa o arquivo externo de perguntas -->
    <script src="perguntas.js"></script>

    <script>
        let nomeJogador = "";
        let perguntasSorteadas = [];
        let perguntaAtual = 0;
        let pontuacao = 0;
        let vidas = 3;
        let ajudasRestantes = 3;
        let travado = false;
        let indiceCorretoAtual = null;

        const loginScreen = document.getElementById("login-screen");
        const chapterScreen = document.getElementById("chapter-screen");
        const gameScreen = document.getElementById("game-screen");
        const scoreScreen = document.getElementById("score-screen");
        
        const playerNameInput = document.getElementById("player-name");
        const welcomeUser = document.getElementById("welcome-user");
        const chapterList = document.getElementById("chapter-list");
        const rankingList = document.getElementById("ranking-list");

        const questionEl = document.getElementById("question");
        const explanationEl = document.getElementById("explanation");
        const optionsEl = document.getElementById("options");
        const progressEl = document.getElementById("progress");
        const livesText = document.getElementById("lives-text");
        const helpBtn = document.getElementById("help-btn");
        const scoreText = document.getElementById("score-text");
        const scoreTitle = document.getElementById("score-title");

        function salvarNome() {
            let nome = playerNameInput.value.trim();
            if (!nome) {
                alert("Por favor, digite seu nome para continuar!");
                return;
            }
            nomeJogador = nome;
            welcomeUser.innerText = `Olá, ${nomeJogador}! 👋`;
            loginScreen.classList.add("hide");
            chapterScreen.classList.remove("hide");
            montarMenuCapitulos();
            carregarRanking();
        }

        function montarMenuCapitulos() {
            chapterList.innerHTML = "";
            let capitulosObj = dadosLivro.capitulos || dadosLivro;

            for (let numCap in capitulosObj) {
                const btn = document.createElement("button");
                btn.className = "chapter-btn";
                btn.innerText = `Capítulo ${numCap}`;
                btn.onclick = () => iniciarCapitulo(capitulosObj[numCap], numCap);
                chapterList.appendChild(btn);
            }
        }

        let capituloEmAndamento = "";
        function iniciarCapitulo(listaPerguntas, numCap) {
            capituloEmAndamento = `Capítulo ${numCap}`;
            let copiaLista = [...listaPerguntas];
            copiaLista.sort(() => Math.random() - 0.5);
            perguntasSorteadas = copiaLista.slice(0, 20);

            perguntaAtual = 0;
            pontuacao = 0;
            vidas = 3;
            ajudasRestantes = 3;

            chapterScreen.classList.add("hide");
            scoreScreen.classList.add("hide");
            gameScreen.classList.remove("hide");
            
            atualizarHUD();
            carregarPergunta();
        }

        function atualizarHUD() {
            let corVidas = "💖".repeat(vidas);
            livesText.innerHTML = `Vidas: ${corVidas}`;
            helpBtn.innerText = `💡 Ajudas (${ajudasRestantes})`;
            helpBtn.disabled = ajudasRestantes <= 0;
            
            const porcentagem = (perguntaAtual / perguntasSorteadas.length) * 100;
            progressEl.style.width = `${porcentagem}%`;
        }

        function carregarPergunta() {
            resetState();
            atualizarHUD();
            let atual = perguntasSorteadas[perguntaAtual];
            questionEl.innerText = atual.pergunta;
            explanationEl.classList.add("hide");

            let opcoesComStatus = atual.opcoes.map((opcao, index) => {
                return { texto: opcao, ehCorreta: (index === atual.resposta) };
            });

            opcoesComStatus.sort(() => Math.random() - 0.5);

            opcoesComStatus.forEach((item, index) => {
                if (item.ehCorreta) {
                    indiceCorretoAtual = index;
                }
            });

            opcoesComStatus.forEach((item, index) => {
                const button = document.createElement("button");
                button.innerText = item.texto;
                button.classList.add("btn");
                button.addEventListener("click", () => selecionarResposta(index, button));
                optionsEl.appendChild(button);
            });
        }

        function resetState() {
            optionsEl.innerHTML = "";
            explanationEl.classList.add("hide");
            travado = false;
        }

        function selecionarResposta(indexSelecionado, button) {
            if (travado) return;
            travado = true;

            let atual = perguntasSorteadas[perguntaAtual];
            const botoes = optionsEl.children;

            if (atual.explicacao) {
                explanationEl.innerText = `💡 Explicação: ${atual.explicacao}`;
                explanationEl.classList.remove("hide");
            }

            if (indexSelecionado === indiceCorretoAtual) {
                button.classList.add("correto");
                pontuacao++;
                setTimeout(proximaEtapa, 2500);
            } else {
                button.classList.add("errado");
                botoes[indiceCorretoAtual].classList.add("correto");
                vidas--;
                atualizarHUD();

                if (vidas <= 0) {
                    setTimeout(mostrarResultadoPerdeu, 2800);
                } else {
                    setTimeout(proximaEtapa, 2800);
                }
            }
        }

        function proximaEtapa() {
            perguntaAtual++;
            if (perguntaAtual < perguntasSorteadas.length) {
                carregarPergunta();
            } else {
                salvarPontuacaoRanking();
                mostrarResultadoVitoria();
            }
        }

        function usarAjuda() {
            if (ajudasRestantes <= 0 || travado) return;
            ajudasRestantes--;
            atualizarHUD();

            let botoes = optionsEl.children;
            let eliminadas = 0;

            for (let i = 0; i < botoes.length; i++) {
                if (i !== indiceCorretoAtual && !botoes[i].classList.contains("disabled-option")) {
                    botoes[i].classList.add("disabled-option");
                    eliminadas++;
                    if (eliminadas === 2) break;
                }
            }
        }

        // Botão Sair: Perde os pontos e volta para o menu
        function sairDoJogo() {
            if (confirm("Tem certeza que deseja sair? Você perderá o progresso e os pontos desta tentativa!")) {
                gameScreen.classList.add("hide");
                chapterScreen.classList.remove("hide");
                montarMenuCapitulos();
                carregarRanking();
            }
        }

        function mostrarResultadoVitoria() {
            gameScreen.classList.add("hide");
            scoreScreen.classList.remove("hide");
            scoreTitle.innerText = "Parabéns! 🎉";
            scoreText.innerHTML = `${nomeJogador}, você concluiu o ${capituloEmAndamento}!<br>Acertou ${pontuacao} de ${perguntasSorteadas.length} perguntas. 🌟`;
        }

        function mostrarResultadoPerdeu() {
            gameScreen.classList.add("hide");
            scoreScreen.classList.remove("hide");
            scoreTitle.innerText = "Suas vidas acabaram! 💔";
            scoreText.innerHTML = `Não foi dessa vez, ${nomeJogador}. Volte para o menu e tente novamente! 🚀`;
        }

        function voltarMenu() {
            scoreScreen.classList.add("hide");
            chapterScreen.classList.remove("hide");
            montarMenuCapitulos();
            carregarRanking();
        }

        // Sistema de Ranking Local (localStorage)
        function salvarPontuacaoRanking() {
            let ranking = JSON.parse(localStorage.getItem("ranking_matematica")) || [];
            ranking.push({ nome: nomeJogador, capitulo: capituloEmAndamento, pontos: pontuacao, total: perguntasSorteadas.length });
            
            // Ordena do maior para o menor acerto
            ranking.sort((a, b) => b.pontos - a.pontos);
            
            // Mantém apenas os 5 melhores
            ranking = ranking.slice(0, 5);
            localStorage.setItem("ranking_matematica", JSON.stringify(ranking));
        }

        function carregarRanking() {
            let ranking = JSON.parse(localStorage.getItem("ranking_matematica")) || [];
            if (ranking.length === 0) {
                rankingList.innerHTML = "<span style='color: #b2bec3;'>Nenhum recorde registrado ainda.</span>";
                return;
            }

            rankingList.innerHTML = "";
            ranking.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "ranking-item";
                div.innerHTML = `<span>#${index + 1} <b>${item.nome}</b> (${item.capitulo})</span> <span><b>${item.pontos}/${item.total}</b></span>`;
                rankingList.appendChild(div);
            });
        }
    </script>
</body>
</html>
